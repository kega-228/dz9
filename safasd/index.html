<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--Завдання. Диспетчер доставок-->

<!--Суть. Потрібно зробити сторінку для диспетчера служби доставки.-->
<!--Диспетчер вносить нові замовлення, бачить їх список і стежить, які замовлення вже прострочені.-->
<!--Дані не повинні зникати після перезавантаження сторінки чи закриття браузера.-->

<!--1. Форма додавання замовлення-->

<!--Форма містить поля:-->

<!--номер замовлення (наприклад, DL-1024);-->
<!--адреса доставки;-->
<!--вага посилки в кілограмах;-->
<!--бажаний час доставки (поле типу «дата й час»);-->
<!--теги через кому, наприклад «крихке, терміново, холодильник».-->

<form>
    <input id="orderNumber" placeholder="номер замовлення (наприклад, DL-1024)" type="text">
    <p id="orderNumberError"></p>
    <input id="address" placeholder="адреса доставки" type="text">
    <p id="addressError"></p>
    <input id="weight" placeholder="вага посилки в кілограмах" type="number">
    <p id="weightError"></p>
    <input id="deliveryTime" placeholder="бажаний час доставки (поле типу «дата й час»)" type="datetime-local">
    <p id="deliveryTimeError"></p>
    <input id="tags" placeholder="теги через кому, наприклад «крихке, терміново, холодильник»" type="text">
    <p id="tagsError"></p>
    <button id="addOrder" type="button">Додати замовлення</button>
</form>

<div>
    <input type="checkbox" id="showOnlyOverdue">
    <label for="showOnlyOverdue">Показувати лише прострочені</label>
    <p id="ordersCounter"></p>
</div>

<ul id="orders">
</ul>






<!--Над списком розміщено:-->

<!--перемикач «Показувати лише прострочені»;-->
<!--лічильник «Усього / прострочено / доставлено».-->
<script src="index.js"></script>
</body>
</html>
